<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML5 简介</title>
</head>

<body>

    <header>
        <h1>HTML5 简介</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">H5</a>
        <a href="#">CSS3</a>
        <a href="#">JS</a>
        <a href="#">About</a>
    </nav>

    <main>
        <section>
            <article>
                <h2>什么是 HTML5？</h2>
                <p>HTML5 是超文本标记语言的第五次重大修订，提供了丰富的<strong>语义标签</strong>，如 header、footer、article、section、aside、nav、main
                    等，让页面结构清晰，利于 SEO 和可访问性。</p>

            </article>
        </section>

        <aside>
            <section>
                <h3>📌 语义标签速览</h3>
                <ul>
                    <li>header — 页眉</li>
                    <li>footer — 页脚</li>
                    <li>article — 文章</li>
                    <li>section — 章节</li>
                    <li>nav — 导航</li>
                    <li>aside — 侧边</li>
                    <li>main — 主内容</li>
                </ul>
            </section>
        </aside>

    </main>

    <footer>
        <p>© 2026 · HTML5 语义标签</p>
    </footer>

</body>

</html>
